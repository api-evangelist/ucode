name: UCode
description: UCode was a STEM coding-education company ("Where Kids Learn to Code and
  Create") that taught kids and teens ages 6-19 software programming through classes,
  camps, and online instruction, creating apps, websites, and games. A seed-stage
  Bloomberg Beta portfolio company founded by Scott Mueller and Michael Yang, it is
  marked as exited in the Bloomberg Beta Manual. As of 2026-07-21 ucode.com is a parked
  domain listed for sale, and no API, developer, or platform surface exists to enrich.
